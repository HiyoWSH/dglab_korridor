## Settings file was created by plugin Korridor HP Bridge v2.0.0
## Plugin GUID: com.dglab.korridor.hpbridge

[Bridge]

## 外部联动服务接收状态的地址
# Setting type: String
# Default value: http://127.0.0.1:9996/game-state
PushUrl = http://127.0.0.1:9996/game-state

## 若联动服务设置了 token，这里填相同的 X-API-Key
# Setting type: String
# Default value: 
ApiKey = 

## 检测状态的间隔（毫秒）
# Setting type: Int32
# Default value: 200
PollIntervalMs = 200

## 即使状态无变化也推送当前状态的间隔（毫秒）
# Setting type: Int32
# Default value: 3000
HeartbeatMs = 3000

[Fields]

## Player 上的死亡标志字段名（bool）
# Setting type: String
# Default value: dead
DeadField = dead

## Player 上返回最大血量的无参静态方法名
# Setting type: String
# Default value: MaxHP
MaxHpMethod = MaxHP

## Data 上的静态字段名
# Setting type: String
# Default value: saveFile
SaveFileField = saveFile

## saveFile 对象上的实例字段名
# Setting type: String
# Default value: currentGameSave
CurrentGameSaveField = currentGameSave

## currentGameSave 对象上的当前血量字段名
# Setting type: String
# Default value: hp
HpField = hp

## currentGameSave 对象上的 Marks 字段名
# Setting type: String
# Default value: marks
MarksField = marks

## MainManager/OpponentsManager 上的单例静态字段名
# Setting type: String
# Default value: I
InstanceField = I

## MainManager 上当前 Boss 字段名（引用类型，null 表示无 Boss）
# Setting type: String
# Default value: currentBoss
CurrentBossField = currentBoss

## MainManager 上 Boss 击杀数字段名
# Setting type: String
# Default value: bossKillCount
BossKillCountField = bossKillCount

## MainManager 上 Boss 二阶段字段名（bool）
# Setting type: String
# Default value: finalBossSecondPhase
BossPhase2Field = finalBossSecondPhase

## OpponentsManager 上各段击杀数字段名（int[]）
# Setting type: String
# Default value: killCountPerSegment
KillCountPerSegmentField = killCountPerSegment

## OpponentsManager 上当前敌人数集合字段名（数组/List）
# Setting type: String
# Default value: activeOpponents
ActiveOpponentsField = activeOpponents

[Il2Cpp]

## 游戏主程序集名
# Setting type: String
# Default value: Assembly-CSharp
Assembly = Assembly-CSharp

## 玩家类全名（含命名空间，如 Game.Player；不确定就先填短名）
# Setting type: String
# Default value: Player
PlayerClass = Player

## Data 类名
# Setting type: String
# Default value: Data
DataClass = Data

## MainManager 类名
# Setting type: String
# Default value: MainManager
MainManagerClass = MainManager

## OpponentsManager 类名
# Setting type: String
# Default value: OpponentsManager
OpponentsClass = OpponentsManager

## 启动时打印每个类/字段/方法的探测结果（更新后校准字段名时很有用）
# Setting type: Boolean
# Default value: true
VerboseProbe = true

